# /var/docker/nginx/conf.d/svod.fleetq.net.conf
# Svod team vault (ADR-0020). Cloudflare (proxied) -> nginx-proxy (CF Origin CA wildcard *.fleetq.net)
# -> svod-engine container on network svod_edge (engine-native TLS on both ports, self-signed).
# /mcp -> MCP port 7518; everything else -> App API port 7517 (personal keys, localAdmin=false).
server {
    listen 80;
    server_name svod.fleetq.net;
    return 301 https://svod.fleetq.net$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name svod.fleetq.net;

    ssl_certificate     /etc/nginx/certs/fleetq.net.crt;
    ssl_certificate_key /etc/nginx/certs/fleetq.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 25m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Self-update is for launchd installs; here the image is replaced by the operator.
    location /api/v1/update { return 404; }

    location /mcp {
        set $up https://svod-engine:7518;
        proxy_pass $up;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location / {
        set $up https://svod-engine:7517;
        proxy_pass $up;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}
