openapi: 3.0.3
info:
  title: Svod App API
  version: 0.25.0
  description: >
    Local control + client API for the Svod engine. Binds to 127.0.0.1 ONLY; remote agent
    access goes through the MCP endpoint, not this API. This contract is the single source of
    truth for all UI clients (Swift, web, …) and is versioned independently of the engine.
  license:
    name: Apache-2.0

servers:
  - url: http://127.0.0.1:7517
    description: Loopback only

tags:
  - name: lifecycle
  - name: files
  - name: search
  - name: graph
  - name: meta
  - name: ops
  - name: events
  - name: memory

paths:
  /health:
    get:
      tags: [lifecycle]
      summary: Liveness probe
      operationId: health
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /ready:
    get:
      tags: [lifecycle]
      summary: Readiness probe
      operationId: ready
      responses:
        "200":
          description: Engine + index are ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }

  /api/v1/tree:
    get:
      tags: [files]
      summary: Vault file tree
      operationId: tree
      responses:
        "200":
          description: Hierarchical tree of notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeNode" }

  /api/v1/file:
    get:
      tags: [files]
      summary: Read a note's current content + revision
      operationId: readFile
      parameters:
        - $ref: "#/components/parameters/PathQuery"
      responses:
        "200":
          description: File content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileContent" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [files]
      summary: Create or update a note (optimistic concurrency)
      operationId: writeFile
      parameters:
        - $ref: "#/components/parameters/PathQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteRequest" }
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [files]
      summary: Soft-delete a note to .trash/
      operationId: deleteFile
      parameters:
        - $ref: "#/components/parameters/PathQuery"
        - { name: expectedRevision, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/file/move:
    post:
      tags: [files]
      summary: Move/rename a note (rewrites backlinks transactionally)
      operationId: moveFile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoveRequest" }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoveResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/file/restore:
    post:
      tags: [files]
      summary: Restore a soft-deleted note from .trash/
      operationId: restoreFile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreRequest" }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/file/history:
    get:
      tags: [files]
      summary: Commit history for a note
      operationId: history
      parameters:
        - $ref: "#/components/parameters/PathQuery"
        - { name: max, in: query, required: false, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: History (most recent first)
          content:
            application/json:
              schema:
                type: object
                required: [commits]
                properties:
                  commits:
                    type: array
                    items: { $ref: "#/components/schemas/CommitInfo" }

  /api/v1/file/diff:
    get:
      tags: [files]
      summary: Unified diff of a note between two revisions
      operationId: diff
      parameters:
        - $ref: "#/components/parameters/PathQuery"
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Diff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiffResult" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/file/revision:
    get:
      tags: [files]
      summary: Read a note's content at a specific revision
      operationId: getRevision
      parameters:
        - $ref: "#/components/parameters/PathQuery"
        - { name: revision, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Content at revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileContent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/file/links:
    get:
      tags: [graph]
      summary: Outgoing + incoming wikilinks for a note
      operationId: fileLinks
      parameters:
        - $ref: "#/components/parameters/PathQuery"
      responses:
        "200":
          description: Links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileLinks" }

  /api/v1/search:
    get:
      tags: [search]
      summary: Hybrid search (keyword / semantic / hybrid) with filters
      description: >
        `q` is optional when a filter (e.g. tags) is present — a filter-only query browses by tag/prefix
        and returns every note carrying it. With neither a query nor a filter the request is a 400.
        Memory typing/lifecycle: results exclude `status: revoked|provisional`, `superseded_by`, and
        past-`expires_at` notes by default (set `includeAll=true` to see them); notes without those
        reserved frontmatter keys are unaffected. Filter by memory class with `type`.
        The MCP `remember` gate may additionally stamp three reserved keys on a memory note, all
        purely informational to this endpoint (they do not affect filtering or visibility):
        `contradicts` (path of a memory this one contradicts — both sides are kept),
        `supersedes` (path of the memory this one replaces; the predecessor carries `superseded_by`),
        and `needs-review: true` (classification could not be settled; awaiting a human).
      operationId: search
      parameters:
        - { name: q, in: query, required: false, schema: { type: string }, description: "Query text; optional when a filter is given." }
        - { name: mode, in: query, required: false, schema: { type: string, enum: [hybrid, keyword, semantic], default: hybrid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 10 } }
        - { name: tags, in: query, required: false, schema: { type: array, items: { type: string } } }
        - { name: pathPrefix, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string }, description: "Memory typing: match only notes with this frontmatter `type` (policy/preference/fact/episode/…)." }
        - { name: status, in: query, required: false, schema: { type: string }, description: "Match only notes with this frontmatter `status` (overrides the default lifecycle hiding for it)." }
        - { name: includeAll, in: query, required: false, schema: { type: boolean, default: false }, description: "Bypass the default lifecycle hiding (revoked/provisional/superseded/expired memories)." }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }

  /api/v1/graph:
    get:
      tags: [graph]
      summary: Global wikilink graph (nodes + edges)
      operationId: graph
      responses:
        "200":
          description: Graph
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Graph" }

  /api/v1/graph/communities:
    get:
      tags: [graph]
      summary: Thematic communities of the derived graph, with pre-computed summaries
      description: >
        ADDITIVE in 0.24.0. Communities come from the derived graph sidecar (wikilinks + embedding
        similarity, clustered by Louvain). Summaries are written at BUILD time; this endpoint
        consults no model. With `query` the communities are ranked by similarity to it, using the
        embedder the search path already uses; without one they are returned largest-first. Returns
        `state: NOT_BUILT` with an empty list when the feature is off or has never been built —
        never an error.
      operationId: graphCommunities
      parameters:
        - { name: query, in: query, required: false, schema: { type: string } }
        - { name: level, in: query, required: false, schema: { type: integer }, description: "Hierarchy level; default the coarsest (broad overview). 0 is the finest and ranks a specific query noticeably better. Out of range is clamped." }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
        - name: members
          in: query
          required: false
          schema: { type: string, enum: [full, sample, none], default: full }
          description: >
            ADDED in 0.25.0. How much of each community's membership to include. `full` is the default
            for backwards compatibility with app v0.2.16, but the member lists dominate the payload —
            on a 3,096-note vault they were 97% of it. New callers should use `sample` (or `none`) and
            fetch one community's membership from /api/v1/graph/community when they need it.
      responses:
        "200":
          description: Communities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphCommunities" }

  /api/v1/graph/community:
    get:
      tags: [graph]
      summary: One community with its full membership
      description: >
        ADDED in 0.25.0. The targeted counterpart to /api/v1/graph/communities: list the themes
        cheaply, then pull every member of the single theme you need.
      operationId: graphCommunity
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Community
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphCommunity" }
        "400":
          description: Missing id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown community id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/graph/status:
    get:
      tags: [graph]
      summary: Build state of the derived graph
      description: >
        ADDITIVE in 0.24.0. `stale` means the vault advanced past the HEAD the graph was built
        against; results are still served. `vectorCoverage` below 1.0 means some notes had no
        embeddings at build time, so their edges are wikilink-only.
      operationId: graphStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphStatus" }

  /api/v1/graph/rebuild:
    post:
      tags: [graph]
      summary: Start a background rebuild of the derived graph
      description: >
        ADDITIVE in 0.24.0. Returns immediately; poll /api/v1/graph/status for progress. 409 when
        the feature is disabled or a build is already running.
      operationId: graphRebuild
      responses:
        "202":
          description: Build started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphStatus" }
        "409":
          description: Disabled or already building
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/tags:
    get:
      tags: [meta]
      summary: Tag taxonomy with counts
      operationId: tags
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tags" }

  /api/v1/settings:
    get:
      tags: [meta]
      summary: Engine settings (read-only view)
      operationId: settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }

  /api/v1/index/status:
    get:
      tags: [meta]
      summary: Index status
      operationId: indexStatus
      responses:
        "200":
          description: Index status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexStatus" }

  /api/v1/metrics:
    get:
      tags: [meta]
      summary: Observability metrics (write latency, queue depth, index lag, sync status)
      operationId: metrics
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }

  /api/v1/conflicts:
    get:
      tags: [meta]
      summary: Surfaced merge conflicts (populated by multi-host sync, Step 7)
      operationId: conflicts
      responses:
        "200":
          description: Conflicts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conflicts" }

  /api/v1/conflicts/resolve:
    post:
      tags: [meta]
      summary: >
        Resolve a surfaced sync conflict. Writes the chosen/merged content through the single
        writer (a normal attributed commit) and clears the conflict. The data for a 3-way merge
        (base/ours/theirs) is on each entry of GET /api/v1/conflicts.
      operationId: resolveConflict
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveConflictRequest" }
      responses:
        "200":
          description: Resolved (conflict cleared, merged content committed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /api/v1/vaults:
    get:
      tags: [meta]
      summary: List the configured vaults (each its own git repo, lock, index, and sync).
      operationId: vaults
      responses:
        "200":
          description: Vaults
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vaults" }
    post:
      tags: [meta]
      summary: >
        Create a brand-new vault at runtime. The engine creates the target directory (refusing a
        non-empty existing one), `git init`s it with an initial seed commit, registers it in the
        persistent engine config (survives a restart), and hot-adds it to the running engine — it
        appears in GET /api/v1/vaults and routes via `?vault=<id>` immediately, no restart. The new
        vault starts solo (no sync, no backup). The 201 body is a Vault row identical in shape to a
        GET /api/v1/vaults item.
      operationId: createVault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVaultRequest" }
      responses:
        "201":
          description: The created vault
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vault" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Duplicate vault id, or the target directory exists and is non-empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The target path could not be created or is not writable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/vaults/{id}:
    delete:
      tags: [meta]
      summary: >
        Remove a vault at runtime. The engine does the LOGICAL removal only: it drains and closes the
        vault, releasing its lock and git/index handles, unregisters it from the running engine (so it
        no longer appears in GET /api/v1/vaults and `?vault=<id>` stops routing to it), and drops it
        from the persistent engine config (survives a restart). It does NOT move files to the OS Trash
        — that is the caller's job, using the returned `path`. When `deleteFiles=true` the engine ALSO
        recursively deletes the vault directory from disk after releasing the locks.
      operationId: deleteVault
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The vault id to remove.
        - name: deleteFiles
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            When true the engine also recursively deletes the vault directory from disk; when false
            the directory is left in place and its path is returned so the caller can dispose of it
            (e.g. move it to the OS Trash).
      responses:
        "200":
          description: The vault was removed (logically, and on disk when deleteFiles=true).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteVaultResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Refusing to delete the default vault (reassign the default first) or the last remaining
            vault (the engine must always keep at least one valid default vault).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/agents:
    get:
      tags: [meta]
      summary: List all configured MCP agents (LLM access).
      operationId: listAgents
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agents" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      tags: [meta]
      summary: >
        Create a new MCP agent at runtime. The agent is persisted in the engine config and hot-added
        to the running registry (no restart needed). The tokenRef must be a Secrets ref
        (env:/file:/keychain:) — raw token values are rejected (422).
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentRequest" }
      responses:
        "201":
          description: The created agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Duplicate agentId.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: tokenRef is a raw value, not a Secrets ref.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/agents/{id}:
    put:
      tags: [meta]
      summary: >
        Update an existing agent's name, role, vaults, tokenRef, or prompt. Only provided fields
        are changed; omitted fields keep their current values.
      operationId: updateAgent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The agentId to update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgentRequest" }
      responses:
        "200":
          description: The updated agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: tokenRef is a raw value, not a Secrets ref.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    delete:
      tags: [meta]
      summary: >
        Remove an agent at runtime. The registry is updated immediately (no restart). Zero agents
        is a valid state.
      operationId: deleteAgent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The agentId to remove.
      responses:
        "200":
          description: The agent was removed.
          content:
            application/json:
              schema:
                type: object
                required: [agentId]
                properties:
                  agentId: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/update/check:
    get:
      summary: Check for a newer engine release.
      operationId: updateCheck
      tags: [update]
      responses:
        "200":
          description: Current version + latest release info (if reachable).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateCheck" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/update/apply:
    post:
      summary: Spawn the self-update script in the background.
      operationId: updateApply
      tags: [update]
      responses:
        "202":
          description: Script spawned; engine will restart once the update completes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateApply" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/import:
    post:
      tags: [meta]
      summary: >
        One-shot import of an existing Obsidian vault (markdown + attachments) through the single
        writer. Idempotent — re-running reconciles rather than duplicating; a present-but-differing
        file is skipped (never clobbered). `.obsidian/` and dot-dirs are skipped, as are symlinks
        (file and directory) and any unreadable entry — each is reported in `skipped` and the import
        continues. Only a missing/non-directory `source` is fatal (400).
      operationId: importVault
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/sync/config:
    get:
      tags: [ops]
      summary: This host's sync + backup configuration (credentials redacted)
      operationId: syncConfig
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      responses:
        "200":
          description: Sync + backup configuration; peer/backup remote credentials are redacted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncConfig" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sync/now:
    post:
      tags: [ops]
      summary: Run one multi-machine sync cycle (fetch → 3-way merge → push the canonical ref)
      operationId: syncNow
      description: >
        Reconciles this vault with the shared remote: commit pending local changes, fetch
        refs/svod/sync/<vault>, fast-forward or 3-way merge, then push (retrying on a non-fast-forward).
        ok=false when the vault is not synced (a no-op). A surfaced conflict is still ok=true with
        conflicts>0 (resolve via /conflicts/resolve). A transport failure is 409, never 500.
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      responses:
        "200":
          description: Reconcile ran (ok=false when sync is not enabled; ok=true with conflicts>0 when overlaps were surfaced).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncAck" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Sync failed (remote unreachable / auth / push rejected past retry).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/backup/now:
    post:
      tags: [ops]
      summary: Push this vault's canonical branch to its off-site backup remote
      operationId: backupNow
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      responses:
        "200":
          description: Backup ack — ok=true when pushed, ok=false when nothing to push (empty repo).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupAck" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No backup remote configured, or the push failed (remote unreachable / auth).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/settings/backup:
    put:
      tags: [ops]
      summary: Set this vault's off-site backup destination (credential-free remote or Secrets ref)
      operationId: setBackup
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupConfigRequest" }
      responses:
        "200":
          description: Accepted; the vault's updated (redacted) sync + backup config is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncConfig" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Remote is blank or embeds inline credentials (use a Secrets ref).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/maintenance/reindex:
    post:
      tags: [ops]
      summary: Rebuild the search index from git HEAD (self-heal after drift)
      operationId: reindex
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      responses:
        "200":
          description: Reindex complete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceAck" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sources:
    get:
      tags: [ops]
      summary: List registered external sources for this vault
      operationId: listSources
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      responses:
        "200":
          description: Registered external sources
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ExternalSource" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [ops]
      summary: Register an external source (a file/dir outside the vault that can be re-synced in)
      operationId: registerSource
      description: >
        The id is derived deterministically from the absolute path, so re-registering the same path
        is idempotent (it updates the existing registration). Registering does not sync; call sync.
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterSourceRequest" }
      responses:
        "200":
          description: The registered source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422":
          description: Path is not absolute
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/sources/{id}:
    patch:
      tags: [ops]
      summary: Update a source's settings (toggle auto-sync / followSymlinks / prune) without re-registering
      operationId: patchSource
      description: >
        Partial update — only the provided fields change. Toggling `autoSync` starts or stops the
        filesystem watcher for this source immediately (no restart). The returned source's `watching`
        flag reflects whether a watcher is now running.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/VaultQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchSourceRequest" }
      responses:
        "200":
          description: The updated source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalSource" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [ops]
      summary: Remove an external source registration (its synced files stay in the vault)
      operationId: removeSource
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/VaultQuery"
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sources/{id}/sync:
    post:
      tags: [ops]
      summary: Re-sync one external source into the vault
      operationId: syncSource
      description: >
        external-wins-unless-locally-edited: new files are created, externally-changed files update
        the vault copy, a vault copy edited since the last sync is reported as a `conflict` (never
        clobbered), and a file gone from the source is reported as `orphaned` (left in the vault).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/VaultQuery"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceSyncResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sources/{id}/resolve:
    post:
      tags: [ops]
      summary: Resolve one conflicted (locally edited) synced path
      operationId: resolveSourceConflict
      description: >
        `takeExternal` overwrites the vault copy with the current external content (external wins
        once). `keepVault` accepts the local edit as the new baseline — it stays quiet until either
        side changes again; a later external change re-surfaces as a conflict rather than silently
        clobbering the kept edit. Both clear the path from the source's `conflicts`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/VaultQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, strategy]
              properties:
                path: { type: string }
                strategy: { type: string, enum: [takeExternal, keepVault] }
      responses:
        "200":
          description: Resolution applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceSyncResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sources/sync:
    post:
      tags: [ops]
      summary: Re-sync all registered external sources for this vault
      operationId: syncAllSources
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      responses:
        "200":
          description: Per-source sync results
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SourceSyncResult" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/events:
    get:
      tags: [events]
      summary: WebSocket stream of live engine events
      operationId: events
      description: >
        Upgrade to a WebSocket. The server pushes JSON-encoded Event objects. Event types:
        file.changed, index.updated, index.progress, commit.created, conflict, engine.status,
        agent.activity, source.synced. index.progress carries { vault, done, total, state } during
        background embedding (throttled emit). source.synced fires when a source's auto-sync watcher
        runs, carrying { vault, sourceId, created, updated, conflicts, deleted } (counts).
      responses:
        "101": { description: Switching Protocols (WebSocket) }

  /api/v1/embedder:
    put:
      tags: [ops]
      summary: Switch the active embedding provider/model (persisted; triggers a background re-embed)
      operationId: setEmbedder
      description: >
        The embedder is a global engine setting (one provider for all vaults). Switching to a
        different dimension wipes + rebuilds the vector index keyword-first; keyword search keeps
        working and semantic is suppressed until the rebuild completes. API keys are accepted ONLY as
        Secrets references (env:/file:/keychain:) — a raw key is rejected (422). Returns 501 on builds
        without embedder control.
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbedderRequest" }
      responses:
        "200":
          description: The new active embedder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedderInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Could not initialize the embedder (e.g. a remote endpoint is unreachable).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Invalid spec (unknown provider, or a raw API key instead of a Secrets ref).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/embedder/test:
    post:
      tags: [ops]
      summary: Probe an embedder spec (embed a test string) without persisting it
      operationId: testEmbedder
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbedderRequest" }
      responses:
        "200":
          description: Probe result (ok=false with an error message when the probe fails).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedderTestResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/embedder/models:
    post:
      tags: [ops]
      summary: List the models a provider can serve (for the UI's model picker)
      description: >
        Mirrors POST /embedder/test (same EmbedderRequest body; model/maxThreads are ignored).
        endpoint/apiKeyRef fall back to the configured embedder when omitted. A provider that cannot be
        enumerated (endpoint unreachable, Ollama down, no key) returns 200 with an empty list — the UI
        treats empty as "fall back to manual entry" — never a 4xx. A raw API key (not a Secrets ref) is
        rejected with 422.
      operationId: listEmbedderModels
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbedderRequest" }
      responses:
        "200":
          description: The provider and the models it can serve (possibly empty).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedderModels" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Invalid spec (unknown provider, or a raw API key instead of a Secrets ref).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/index/reembed:
    post:
      tags: [ops]
      summary: Re-embed the whole vault in the background (keyword search stays available)
      operationId: reembed
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      responses:
        "200":
          description: Current index status (the re-embed runs in the background)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexStatus" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/index/pause:
    post:
      tags: [ops]
      summary: Pause the background embedding pass (keyword search is unaffected)
      operationId: pauseIndex
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      responses:
        "200":
          description: Current index status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexStatus" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/index/resume:
    post:
      tags: [ops]
      summary: Resume a paused background embedding pass
      operationId: resumeIndex
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      responses:
        "200":
          description: Current index status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexStatus" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/memory/capture:
    post:
      tags: [memory]
      summary: Capture a raw session transcript into the recall quarantine (idempotent on sessionId)
      operationId: captureSession
      description: >
        Writes the raw transcript to messy/sessions/ (frontmatter type=session). UNCONDITIONALLY
        excluded from recall (search + context_pack) — like <private>. Idempotent on sessionId:
        a re-capture returns the existing note (deduped=true), never a duplicate. The write-path
        secret scanner is bypassed so a transcript carrying a token is never rejected.
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaptureRequest" }
      responses:
        "200":
          description: The captured (or pre-existing) session note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/memory/sessions:
    get:
      tags: [memory]
      summary: List captured session notes (newest first), optionally filtered by distilled
      operationId: listSessions
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
        - { name: distilled, in: query, required: false, schema: { type: boolean } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Session notes, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Session" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/memory/sessions/mark-distilled:
    post:
      tags: [memory]
      summary: Mark sessions distilled and record the curated note refs (for dashboard compression math)
      operationId: markSessionsDistilled
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkDistilledRequest" }
      responses:
        "200":
          description: Count of session notes flipped to distilled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkDistilledResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/memory/proposals:
    get:
      tags: [memory]
      summary: List capture proposals (suggestions inbox) by status
      operationId: listProposals
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, accepted, rejected], default: open } }
      responses:
        "200":
          description: Proposals with the given status
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Proposal" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [memory]
      summary: Append a capture proposal (the external distiller suggests a skill/tool)
      operationId: createProposal
      description: Engine assigns id/createdAt/status=open. Deduped by (kind, title, scope).
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProposalRequest" }
      responses:
        "200":
          description: The proposal id (new or pre-existing dedup match)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateProposalResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/memory/proposals/{id}:
    post:
      tags: [memory]
      summary: Accept or reject a proposal (status transition ONLY — no auto-create)
      operationId: actProposal
      description: >
        Accept does NOT auto-create a skill/tool — suggestions over automation. It only moves the
        proposal to accepted/rejected so an operator can act on it deliberately.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/VaultQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposalActionRequest" }
      responses:
        "200":
          description: The updated proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/memory/dashboard:
    get:
      tags: [memory]
      summary: Recall subsystem dashboard (capture/distill counts + byte compression)
      operationId: memoryDashboard
      parameters:
        - $ref: "#/components/parameters/VaultQuery"
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryDashboard" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    PathQuery:
      name: path
      in: query
      required: true
      description: Vault-relative note path (e.g. "vault/note.md"). URL-encoded; may contain Cyrillic.
      schema: { type: string }
    VaultQuery:
      name: vault
      in: query
      required: false
      description: >
        Target vault id (see GET /api/v1/vaults). Omitted ⇒ the default vault. Every per-vault
        route (tree, file*, search, graph, tags, settings, index/status, conflicts*, metrics,
        import) accepts this parameter; an unknown id is a 404.
      schema: { type: string }

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Optimistic-concurrency conflict; current state returned for a 3-way merge
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConflictBody" }
    NotImplemented:
      description: Not implemented in this build (feature-detect via the API version).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    Ready:
      type: object
      required: [ready, engine, index]
      properties:
        ready: { type: boolean }
        engine: { type: boolean }
        index: { type: boolean }

    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }

    FileContent:
      type: object
      required: [path, revision, content]
      properties:
        path: { type: string }
        revision: { type: string }
        content: { type: string }

    WriteRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
        expectedRevision:
          type: string
          nullable: true
          description: Blob revision the client last saw; null/omitted means "create new".

    WriteResult:
      type: object
      required: [path, revision, commit]
      properties:
        path: { type: string }
        revision: { type: string }
        commit: { type: string }

    ConflictBody:
      type: object
      required: [path]
      properties:
        path: { type: string }
        expected: { type: string, nullable: true }
        current: { type: string, nullable: true }
        currentContent: { type: string, nullable: true }

    MoveRequest:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
        expectedRevision: { type: string, nullable: true }

    MoveResult:
      type: object
      required: [path, revision, commit, rewrittenBacklinks]
      properties:
        path: { type: string }
        revision: { type: string }
        commit: { type: string }
        rewrittenBacklinks:
          type: array
          description: Notes whose [[wikilinks]] were rewritten in the same commit.
          items: { type: string }

    RestoreRequest:
      type: object
      required: [trashPath]
      properties:
        trashPath: { type: string }
        to: { type: string, nullable: true }

    TreeNode:
      type: object
      required: [name, path, type]
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string, enum: [file, dir] }
        children:
          type: array
          items: { $ref: "#/components/schemas/TreeNode" }

    CommitInfo:
      type: object
      required: [commit, author, email, epochSeconds, message]
      properties:
        commit: { type: string }
        author: { type: string }
        email: { type: string }
        epochSeconds: { type: integer, format: int64 }
        message: { type: string }

    DiffResult:
      type: object
      required: [path, from, to, diff]
      properties:
        path: { type: string }
        from: { type: string }
        to: { type: string }
        diff: { type: string }

    SearchResult:
      type: object
      required: [mode, hits]
      properties:
        mode: { type: string, enum: [HYBRID, KEYWORD, SEMANTIC] }
        hits:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }

    SearchHit:
      type: object
      required: [path, heading, snippet, score, matchedKeyword, matchedSemantic, tags]
      properties:
        path: { type: string }
        heading: { type: string }
        snippet: { type: string }
        score: { type: number }
        matchedKeyword: { type: boolean }
        matchedSemantic: { type: boolean }
        tags: { type: array, items: { type: string } }
        vault: { type: string, nullable: true, description: Vault id of this hit (set on federated across=true search). }
        tokens: { type: integer, description: "Cheap ~4-chars/token estimate of this hit's snippet (same estimator as context_pack). Additive; older clients ignore it." }

    Graph:
      type: object
      required: [nodes, edges, unresolved]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, path]
            properties:
              id: { type: string }
              path: { type: string }
        edges:
          type: array
          items:
            type: object
            required: [source, target]
            properties:
              source: { type: string }
              target: { type: string }
        unresolved:
          type: array
          items:
            type: object
            required: [source, target]
            properties:
              source: { type: string }
              target: { type: string }

    GraphCommunity:
      type: object
      required: [id, level, title, size, members]
      properties:
        id: { type: string, description: "Stable for an unchanged vault; ids shift if the corpus changes." }
        level: { type: integer, description: "0 is the finest level of the hierarchy." }
        title: { type: string, description: "LLM title when summarised, else a label derived from member paths." }
        summary:
          type: string
          nullable: true
          description: "Null when no summary provider was active at build time. The community is still usable."
        size: { type: integer, description: "The TRUE member count, regardless of how many paths `members` carries." }
        members:
          type: array
          description: "Membership as requested by the `members` parameter; may be a sample or empty. `size` is authoritative."
          items: { type: string }

    GraphCommunities:
      type: object
      required: [state, stale, communities]
      properties:
        state: { type: string, enum: [NOT_BUILT, BUILDING, READY, ERROR] }
        stale: { type: boolean }
        communities:
          type: array
          items: { $ref: "#/components/schemas/GraphCommunity" }

    GraphStatus:
      type: object
      required: [state, enabled]
      properties:
        state: { type: string, enum: [NOT_BUILT, BUILDING, READY, ERROR] }
        enabled: { type: boolean }
        head: { type: string, nullable: true, description: "HEAD the graph was built against." }
        currentHead: { type: string, nullable: true }
        stale: { type: boolean }
        builtAt: { type: integer, format: int64, nullable: true }
        noteCount: { type: integer }
        edgeCount: { type: integer }
        linkEdgeCount: { type: integer, description: "Edges from resolved wikilinks." }
        simEdgeCount: { type: integer, description: "Edges inferred from embedding similarity." }
        communityCount: { type: integer }
        levelCount: { type: integer }
        vectorCoverage:
          type: number
          format: double
          description: "Fraction of notes that had vectors at build time. Below 1.0 ⇒ some edges are wikilink-only."
        summaryProvider: { type: string }
        summarisedCount: { type: integer }
        error: { type: string, nullable: true }
        progress: { type: string, nullable: true }

    FileLinks:
      type: object
      required: [path, outlinks, backlinks, unresolved]
      properties:
        path: { type: string }
        outlinks:
          type: array
          items:
            type: object
            required: [target]
            properties:
              target: { type: string }
              resolved: { type: string, nullable: true }
        backlinks: { type: array, items: { type: string } }
        unresolved: { type: array, items: { type: string } }
        crossVaultBacklinks:
          type: array
          description: Notes in OTHER vaults that link here, as global ids ("vault:path"). Qualified [[vault:note]] links.
          items: { type: string }

    Tags:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          items:
            type: object
            required: [tag, count]
            properties:
              tag: { type: string }
              count: { type: integer }

    Settings:
      type: object
      required: [vaultPath, apiVersion, embedderProvider, host, embedder, reranker]
      properties:
        vaultPath: { type: string }
        apiVersion: { type: string }
        embedderProvider: { type: string, description: "Deprecated flat field; prefer embedder.provider." }
        embedderModel: { type: string }
        embedderDim: { type: integer }
        host: { type: string }
        embedder: { $ref: "#/components/schemas/EmbedderInfo" }
        reranker: { $ref: "#/components/schemas/RerankerInfo" }

    RerankerInfo:
      type: object
      required: [provider, model, active]
      description: The active second-stage reranker (provider 'none' when disabled).
      properties:
        provider: { type: string, description: "none | remote (| local-onnx when added)" }
        model: { type: string }
        active: { type: boolean }

    EmbedderInfo:
      type: object
      required: [provider, model, dimension]
      description: The active embedder. endpoint is null for in-process providers (local-onnx/none).
      properties:
        provider: { type: string, description: "local-onnx | local-ollama | remote-openai | none" }
        model: { type: string }
        endpoint: { type: string, nullable: true }
        dimension: { type: integer, description: "Vector dimension (0 when BM25-only / not yet indexed)." }

    EmbeddingStatus:
      type: object
      required: [state, done, total, provider, model]
      description: Background-embedding progress (also pushed as the index.progress event).
      properties:
        state: { type: string, enum: [idle, running, paused, error] }
        done: { type: integer }
        total: { type: integer }
        provider: { type: string }
        model: { type: string }
        error: { type: string, nullable: true }
        ratePerSec: { type: number, nullable: true, description: "Rolling embed throughput (chunks/sec) while running." }
        etaSeconds: { type: integer, format: int64, nullable: true, description: "Estimated seconds remaining for the pass." }

    EmbedderRequest:
      type: object
      required: [provider]
      description: >
        Switch (PUT /embedder) or probe (POST /embedder/test) the embedder. apiKeyRef is a Secrets
        reference (env:/file:/keychain:) — a raw key is rejected. model/endpoint override the
        provider defaults; maxThreads caps background embedding workers.
      properties:
        provider: { type: string, description: "local-onnx | local-ollama | remote-openai | none" }
        model: { type: string, nullable: true }
        endpoint: { type: string, nullable: true }
        apiKeyRef: { type: string, nullable: true }
        maxThreads: { type: integer, nullable: true }

    EmbedderTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        dimension: { type: integer, nullable: true }
        latencyMs: { type: integer, format: int64, nullable: true }
        error: { type: string, nullable: true }

    EmbedderModels:
      type: object
      required: [provider, models]
      description: The models a provider can serve. An empty list means "fall back to manual entry".
      properties:
        provider: { type: string, description: "local-onnx | local-ollama | remote-openai | none" }
        models:
          type: array
          items: { $ref: "#/components/schemas/EmbedderModelOption" }

    EmbedderModelOption:
      type: object
      required: [id]
      properties:
        id: { type: string }
        dimension: { type: integer, nullable: true, description: "Included only when cheaply known." }

    IndexStatus:
      type: object
      required: [docCount, model, dim, keywordReady, embedding]
      properties:
        docCount: { type: integer }
        headIndexed: { type: string, nullable: true }
        model: { type: string }
        dim: { type: integer }
        keywordReady: { type: boolean, description: "True once BM25 search is consistent with HEAD." }
        embedding: { $ref: "#/components/schemas/EmbeddingStatus" }

    Conflicts:
      type: object
      required: [conflicts]
      description: Sync merge conflicts surfaced by the merge authority (never auto-resolved).
      properties:
        conflicts:
          type: array
          items:
            type: object
            required: [path]
            description: >
              A surfaced conflict. base/ours/theirs carry the three versions a client needs to
              render a 3-way merge UI; any may be null (e.g. a file added on one side only).
            properties:
              path: { type: string }
              reasons: { type: array, items: { type: string } }
              base: { type: string, nullable: true }
              ours: { type: string, nullable: true }
              theirs: { type: string, nullable: true }
              ts: { type: integer, format: int64, description: When the conflict was recorded (epoch millis). }

    Vault:
      type: object
      required: [id, name, default]
      description: One vault row (also the POST /api/v1/vaults 201 body).
      properties:
        id: { type: string }
        name: { type: string }
        default: { type: boolean }
        sync: { $ref: "#/components/schemas/SyncStatus" }

    Vaults:
      type: object
      required: [vaults]
      properties:
        vaults:
          type: array
          items: { $ref: "#/components/schemas/Vault" }

    CreateVaultRequest:
      type: object
      required: [id]
      description: Create a new vault. Only `id` is required; `name` and `path` are derived when omitted.
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]*$"
          description: Unique vault id/slug.
        name: { type: string, nullable: true, description: "Display name; defaults to id when omitted." }
        path:
          type: string
          nullable: true
          description: >
            Absolute filesystem path for the new vault's git repo. When omitted the engine derives a
            default location (a sibling of an existing vault, + id).

    DeleteVaultResult:
      type: object
      required: [id, path, filesDeleted]
      description: Result of DELETE /api/v1/vaults/{id}.
      properties:
        id: { type: string }
        path:
          type: string
          description: >
            The vault's on-disk directory that was removed (filesDeleted=true) or that the caller
            should now dispose of, e.g. move to the OS Trash (filesDeleted=false).
        filesDeleted:
          type: boolean
          description: True when the engine recursively deleted the directory from disk (deleteFiles=true).

    Agent:
      type: object
      required: [agentId, role, vaults, tokenRef]
      description: One MCP agent (also the POST/PUT /api/v1/agents body).
      properties:
        agentId: { type: string }
        name: { type: string, nullable: true }
        role: { type: string, description: "READ_ONLY | WRITE" }
        vaults:
          type: array
          items: { type: string }
          description: Vault ids this agent may access. Empty = default vault only.
        tokenRef:
          type: string
          description: "Secrets ref for the bearer token (env:/file:/keychain:) — never the raw value."
        prompt: { type: string, nullable: true, description: Optional system prompt (config-only metadata). }

    Agents:
      type: object
      required: [agents, mcpPort, mcpUrl]
      properties:
        agents:
          type: array
          items: { $ref: "#/components/schemas/Agent" }
        mcpPort: { type: integer, description: The MCP endpoint port. }
        mcpUrl: { type: string, description: "Full MCP endpoint URL (http://<host>:<mcpPort>)." }

    CreateAgentRequest:
      type: object
      required: [agentId, role, tokenRef]
      description: Create a new MCP agent.
      properties:
        agentId:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]*$"
          description: Unique agent id/slug.
        name: { type: string, nullable: true, description: "Display name; defaults to agentId when omitted." }
        role:
          type: string
          description: "READ_ONLY | WRITE (case-insensitive)."
        vaults:
          type: array
          items: { type: string }
          description: Vault ids to grant access to. Empty = default vault only.
        tokenRef:
          type: string
          description: "Secrets ref for the bearer token (env:/file:/keychain:) — raw tokens are rejected (422)."
        prompt: { type: string, nullable: true, description: Optional system prompt (config-only metadata). }

    UpdateAgentRequest:
      type: object
      description: Partial update of an agent; omitted fields are left unchanged.
      properties:
        name: { type: string, nullable: true }
        role: { type: string, nullable: true, description: "READ_ONLY | WRITE (case-insensitive)." }
        vaults:
          type: array
          nullable: true
          items: { type: string }
        tokenRef:
          type: string
          nullable: true
          description: "Secrets ref for the bearer token (env:/file:/keychain:) — raw tokens are rejected (422)."
        prompt: { type: string, nullable: true }

    ImportRequest:
      type: object
      required: [source]
      description: Import an Obsidian vault directory (local path) into a Svod vault.
      properties:
        source: { type: string, description: Local filesystem path to the Obsidian vault directory. }
        into: { type: string, nullable: true, description: Optional subfolder prefix within the target vault. }
        vault: { type: string, nullable: true, description: Target vault id; omitted ⇒ default vault. }
        followSymlinks:
          type: boolean
          default: false
          description: >
            When false (default) symlinks are skipped and listed in `skipped`. When true they are
            materialized — file links copied as files, directory links descended into and their
            contents copied under the link's path (links may point outside `source`; loops are
            detected and skipped). Use to pull in a vault whose notes are links into other projects.

    ImportResult:
      type: object
      required: [imported, unchanged, skipped]
      description: >
        imported = newly written, unchanged = already identical (idempotent re-run),
        skipped = present-but-differing (left as-is), blocked by secret scanning, a symlink, or unreadable.
      properties:
        imported: { type: array, items: { type: string } }
        unchanged: { type: array, items: { type: string } }
        skipped: { type: array, items: { type: string } }

    RegisterSourceRequest:
      type: object
      required: [path]
      description: Register an external file/dir (absolute local path) as a re-syncable source.
      properties:
        path: { type: string, description: Absolute filesystem path to a file or directory outside the vault. }
        into: { type: string, nullable: true, description: Vault subpath prefix to materialize the source under. }
        followSymlinks:
          type: boolean
          default: false
          description: Follow symlinks found inside a directory source (the source root is always resolved).
        prune:
          type: boolean
          default: false
          description: >
            Propagate deletions — a file gone from the source is soft-deleted from the vault (still
            guarded: a locally-edited copy is left as orphaned, never deleted). Off by default.
        autoSync:
          type: boolean
          default: false
          description: >
            Auto-sync on filesystem change — a watcher re-syncs this source shortly (~1s) after its
            files settle. Off by default. Emits a `source.synced` event (see GET /api/v1/events).
        writeBack:
          type: boolean
          default: false
          description: >
            Two-way (0.20.0) — a vault edit to an already-synced path is written back to the
            external file shortly after the commit, provided the external side hasn't moved since
            the baseline (else it surfaces as a conflict). Vault-created files are not materialized
            externally; only tracked paths flow back.

    PatchSourceRequest:
      type: object
      description: Partial update of a source; omitted fields are left unchanged.
      properties:
        autoSync: { type: boolean, nullable: true, description: Toggle the auto-sync filesystem watcher. }
        followSymlinks: { type: boolean, nullable: true }
        prune: { type: boolean, nullable: true }
        writeBack: { type: boolean, nullable: true, description: Toggle two-way write-back of vault edits (0.20.0). }

    ExternalSource:
      type: object
      required: [id, path, into, followSymlinks, prune]
      description: A registered external source. `id` is derived deterministically from `path`.
      properties:
        id: { type: string }
        path: { type: string }
        into: { type: string }
        followSymlinks: { type: boolean }
        prune: { type: boolean }
        autoSync: { type: boolean, description: Auto-sync on filesystem change is enabled. }
        writeBack: { type: boolean, description: Two-way write-back of vault edits is enabled (0.20.0). }
        watching: { type: boolean, description: "Live, read-only: a filesystem watcher is currently running for this source." }
        lastSyncedAt: { type: string, nullable: true, description: "ISO-8601 instant of the last successful sync, or null." }
        conflicts:
          type: array
          items: { type: string }
          description: Vault paths whose local edits blocked the external update at the last sync.

    SourceSyncResult:
      type: object
      required: [id]
      description: >
        Per-source sync outcome. created/updated/unchanged are vault paths written or matched;
        conflicts = vault copy locally edited since last sync (left as-is); orphaned = gone from the
        source (left in the vault); deleted = gone from the source AND pruned (soft-deleted);
        skipped = secret-scanner-blocked. error is set if the source path was unreadable (the sync is
        then a no-op, not a failure of the whole request).
      properties:
        id: { type: string }
        created: { type: array, items: { type: string } }
        updated: { type: array, items: { type: string } }
        unchanged: { type: array, items: { type: string } }
        conflicts: { type: array, items: { type: string } }
        orphaned: { type: array, items: { type: string } }
        deleted: { type: array, items: { type: string } }
        skipped: { type: array, items: { type: string } }
        pushed:
          type: array
          items: { type: string }
          description: Vault edits written back to the external files (writeBack sources, 0.20.0).
        error: { type: string, nullable: true }

    ResolveConflictRequest:
      type: object
      required: [path, content]
      description: The merged/chosen content to commit, clearing the conflict for `path`.
      properties:
        path: { type: string }
        content: { type: string }
        expectedRevision:
          type: string
          nullable: true
          description: >
            Optional optimistic guard. Omit/null to resolve against the current on-disk
            revision; set it to pin a specific one. Either way a change landing after you
            resolved yields 409 (never a silent overwrite).

    Metrics:
      type: object
      required: [write, queueDepth, peakQueueDepth, index, conflicts]
      properties:
        write:
          type: object
          required: [count, avgMs, maxMs, lastMs]
          properties:
            count: { type: integer, format: int64 }
            avgMs: { type: number }
            maxMs: { type: number }
            lastMs: { type: number }
        queueDepth: { type: integer }
        peakQueueDepth: { type: integer }
        index:
          type: object
          required: [docCount, lagging]
          properties:
            docCount: { type: integer }
            head: { type: string, nullable: true }
            indexedHead: { type: string, nullable: true }
            lagging: { type: boolean }
        conflicts: { type: integer }
        sync:
          type: object
          nullable: true
          required: [role, conflicts]
          properties:
            role: { type: string }
            lastHead: { type: string, nullable: true }
            conflicts: { type: integer }
            syncStatus: { type: string, nullable: true }
            lastSyncedAt: { type: string, nullable: true }

    SyncStatus:
      type: object
      required: [role, conflicts]
      description: Per-vault sync status (the GET /vaults `sync` dot).
      properties:
        role: { type: string, description: "synced | authority | follower | solo" }
        lastHead: { type: string, nullable: true }
        conflicts: { type: integer }
        syncStatus: { type: string, nullable: true, description: "inSync | syncing | conflicts | offline | error (null until first sync)" }
        lastSyncedAt: { type: string, nullable: true, description: ISO-8601 instant of the last successful two-way sync. }

    BackupConfigRequest:
      type: object
      required: [remote, enabled]
      description: >
        Set a vault's backup destination and (optionally) its auto-backup schedule. `remote` must be a
        credential-free git URL or a `Secrets` ref (env:/file:/keychain:) — a URL embedding a password
        (user:pass@) is rejected (422). The three schedule fields are additive and optional; auto-backup
        runs only when `enabled` is true. Credentials are never accepted or returned over this API.
      properties:
        remote: { type: string }
        enabled: { type: boolean }
        backupOnStartup: { type: boolean, description: Back up once shortly after the engine becomes ready. }
        backupIntervalMinutes:
          type: integer
          nullable: true
          description: Periodic backup cadence in minutes; null or 0 disables the timer.
        backupOnChange: { type: boolean, description: Back up after vault writes settle (a short quiet period). }
        syncEnabled:
          type: boolean
          description: >
            Enable two-way multi-machine sync on this vault. When true the same `remote` becomes the
            bidirectional bus (canonical ref refs/svod/sync/<vault>) and one-way backup is retired.
        syncIntervalMinutes:
          type: integer
          nullable: true
          description: Background sync poll cadence in minutes; null ⇒ engine default (3).

    SyncConfig:
      type: object
      required: [backupEnabled, syncPeers]
      description: A vault's sync + backup configuration. Credentials in any remote URL are redacted.
      properties:
        backupRemote: { type: string, nullable: true }
        backupEnabled: { type: boolean }
        backupOnStartup: { type: boolean, description: Auto-backup once after the engine is ready (opt-in). }
        backupIntervalMinutes:
          type: integer
          nullable: true
          description: Periodic auto-backup cadence in minutes; null or 0 means no timer.
        backupOnChange: { type: boolean, description: Auto-backup after vault writes settle (opt-in). }
        lastBackupAt:
          type: string
          nullable: true
          description: ISO-8601 instant of the last successful backup (null until one succeeds).
        lastBackupHead:
          type: string
          nullable: true
          description: Commit sha last pushed to the backup ref (null until one succeeds).
        syncPeers:
          type: array
          items: { type: string }
          description: Configured sync remotes, credentials redacted (the sync remote when synced).
        role: { type: string, nullable: true, description: "synced | authority | follower | solo" }
        hostId: { type: string, nullable: true, description: "This machine's stable, persistent host id." }
        syncEnabled: { type: boolean, description: Two-way sync on (same remote as backupRemote; one-way backup retired). }
        syncIntervalMinutes: { type: integer, nullable: true, description: Background sync poll cadence in minutes (default 3). }
        syncStatus: { type: string, nullable: true, description: "inSync | syncing | conflicts | offline | error (null until first sync)" }
        lastSyncedAt: { type: string, nullable: true, description: ISO-8601 instant of the last successful sync. }

    MaintenanceAck:
      type: object
      required: [started]
      properties:
        started: { type: boolean }
        docCount: { type: integer, nullable: true }

    BackupAck:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, description: "True on success (including 'already up to date'); false only on real failures (auth, network, rejected push)." }
        head: { type: string, nullable: true, description: Backup commit sha (null when there is nothing to back up). }
        noChange: { type: boolean, description: "True when the backup succeeded but had nothing new to push (already up to date). Still ok=true." }

    SyncAck:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        head: { type: string, nullable: true }
        conflicts: { type: integer, nullable: true, description: Merge conflicts surfaced (see GET /conflicts). }

    UpdateCheck:
      type: object
      required: [currentVersion, updateAvailable, compatible]
      properties:
        currentVersion: { type: string }
        currentContract: { type: string, nullable: true }
        latestVersion: { type: string, nullable: true }
        updateAvailable: { type: boolean }
        compatible: { type: boolean }
        assetName: { type: string, nullable: true }
        assetUrl: { type: string, nullable: true }
        sha256: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        publishedAt: { type: string, nullable: true }

    UpdateApply:
      type: object
      required: [started]
      properties:
        started: { type: boolean }
        candidateVersion: { type: string, nullable: true }

    Event:
      type: object
      required: [type, ts, data]
      properties:
        type:
          type: string
          enum: [file.changed, index.updated, index.progress, commit.created, conflict, engine.status, agent.activity, source.synced]
        ts: { type: integer, format: int64 }
        data: { type: object, additionalProperties: true }

    # ---- Recall memory subsystem. Enum wire convention: kind/scope/status are LOWERCASE. ----

    CaptureRequest:
      type: object
      required: [sessionId, transcript, startedAt, endedAt]
      properties:
        sessionId: { type: string }
        project: { type: string, nullable: true }
        transcript: { type: string }
        startedAt: { type: integer, format: int64, description: epoch millis }
        endedAt: { type: integer, format: int64, description: epoch millis }
        toolCallCount: { type: integer, nullable: true }

    CaptureResult:
      type: object
      required: [path, revision, deduped]
      properties:
        path: { type: string }
        revision: { type: string }
        deduped: { type: boolean, description: true when the sessionId was already captured }

    Session:
      type: object
      required: [path, sessionId, startedAt, endedAt, bytes, distilled]
      properties:
        path: { type: string }
        project: { type: string, nullable: true }
        sessionId: { type: string }
        startedAt: { type: integer, format: int64 }
        endedAt: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        distilled: { type: boolean }

    MarkDistilledRequest:
      type: object
      required: [paths, noteRefs]
      properties:
        paths: { type: array, items: { type: string } }
        noteRefs:
          type: array
          items: { type: string }
          description: Curated note paths the distiller wrote (recorded for dashboard compression math).

    MarkDistilledResult:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }

    Proposal:
      type: object
      required: [id, kind, title, scope, confidence, rationale, sourceSessions, createdAt, status]
      properties:
        id: { type: string }
        kind: { type: string, enum: [skill, tool] }
        title: { type: string }
        scope: { type: string, enum: [project, global] }
        confidence: { type: number, format: double }
        rationale: { type: string }
        sourceSessions: { type: array, items: { type: string } }
        createdAt: { type: integer, format: int64 }
        status: { type: string, enum: [open, accepted, rejected] }
        note: { type: string, nullable: true }

    CreateProposalRequest:
      type: object
      required: [kind, title, scope, confidence, rationale, sourceSessions]
      properties:
        kind: { type: string, enum: [skill, tool] }
        title: { type: string }
        scope: { type: string, enum: [project, global] }
        confidence: { type: number, format: double }
        rationale: { type: string }
        sourceSessions: { type: array, items: { type: string } }

    CreateProposalResult:
      type: object
      required: [id]
      properties:
        id: { type: string }

    ProposalActionRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [accept, reject] }
        note: { type: string, nullable: true }

    MemoryDashboard:
      type: object
      required: [sessionsCaptured, sessionsDistilled, notesWritten, capturedBytes, distilledBytes, compressionRatio, openProposals]
      properties:
        sessionsCaptured: { type: integer }
        sessionsDistilled: { type: integer }
        notesWritten: { type: integer, description: distinct curated note refs recorded across distill passes }
        capturedBytes: { type: integer, format: int64 }
        distilledBytes: { type: integer, format: int64 }
        compressionRatio: { type: number, format: double, description: "capturedBytes / max(1, distilledBytes)" }
        lastDistillAt: { type: integer, format: int64, nullable: true }
        openProposals: { type: integer }
