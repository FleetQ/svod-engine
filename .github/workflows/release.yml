name: release

# Cut a release by pushing a tag, e.g. `git tag v0.4.0 && git push origin v0.4.0`.
# A `-rc`/`-beta` tag publishes a prerelease. Each OS runner builds in place — native-image is
# host-only, so cross-platform binaries require this matrix (you cannot cross-compile them).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release + upload assets

jobs:
  # The release is created as a DRAFT here and published by `finalize` only after every required
  # asset is on it. Before, each build job published into the release itself: the first job to
  # finish flipped it out of draft, so v1.24.0 went public carrying only the two Linux assets
  # while the other two jobs were still failing their uploads.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — reusing it"
            exit 0
          fi
          args=(--draft --generate-notes --title "$TAG")
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" "${args[@]}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       label: macos-arm64,   exe: "" }
          - { os: ubuntu-latest,  label: linux-x64,     exe: "" }
          - { os: windows-latest, label: windows-x64,   exe: ".exe" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      # --- Toolchain 1: GraalVM/JDK 21 — builds the shipping jpackage app-image (incl. onnx-local). ---
      # Pinned to the proven GraalVM CE 21 so the app-image (the reliable v1.0.0 artifact) never regresses.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # --- Reliable artifact: self-contained app-image (full features, incl. onnx-local) ---
      - name: Build app-image (jpackage)
        run: |
          ./gradlew -Psvod.jdk=21 installDist --no-daemon
          MAIN_JAR=$(basename "$(ls build/install/svod-engine/lib/svod-engine-*.jar)")
          # jpackage --app-version accepts only numeric MAJOR[.MINOR[.PATCH]] — strip the tag's
          # leading `v` and any pre-release suffix (`v1.11.2-rc1` → `1.11.2`), else jpackage errors.
          APP_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="${APP_VERSION%%-*}"
          jpackage --type app-image --name SvodEngine \
            --input build/install/svod-engine/lib \
            --main-jar "$MAIN_JAR" --main-class dev.svod.engine.MainKt \
            --app-version "$APP_VERSION" --java-options "-Dfile.encoding=UTF-8" \
            --dest out

      - name: Archive app-image (unix)
        if: runner.os != 'Windows'
        run: |
          cd out
          if [ -d SvodEngine.app ]; then tar -czf "../SvodEngine-${{ matrix.label }}.tar.gz" SvodEngine.app
          else tar -czf "../SvodEngine-${{ matrix.label }}.tar.gz" SvodEngine; fi

      - name: Archive app-image (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/SvodEngine -DestinationPath SvodEngine-${{ matrix.label }}.zip

      # --- Toolchain 2: Oracle GraalVM/JDK 23 — builds the native-image single binary. ---
      # GraalVM CE for JDK 21 is permanently stuck at 21.0.2 (no community 21.0.3+), whose link stage
      # is a dead-end: macOS Xcode 15 ld rejects its objects, Linux libjava.a lacks
      # ScopedMemoryAccess.closeScope0, and FFM is incomplete. GraalVM CE for JDK 23 fixes all three
      # (complete FFM + modern linkers). This second setup-graalvm puts JDK 23 on PATH; the app-image
      # above already ran on JDK 21 and is unaffected. The native step builds with -Psvod.jdk=23.
      #
      # Oracle GraalVM, not CE, since 1.34.2: its Profile-Guided Optimization closes most of the gap to the JVM
      # that a native image has without a JIT (5 000-note vault, CE -> PGO: multi-word search 5.5 -> 3.1 ms,
      # tree 37.7 -> 29.1 ms, RSS 177 -> 115 MB; see CHANGELOG 1.34.2). Licence: GraalVM Free Terms and Conditions (GFTC): free, production use
      # allowed, redistribution allowed if not for a fee. Only the native binaries are built with it; the
      # app-image keeps GraalVM CE 21 above.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "23"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Native-image links via the host C toolchain; on Windows that means MSVC. setup-graalvm does not
      # provision it, so without this the link stage fails with "Failed to find 'vcvarsall.bat'".
      # continue-on-error: this action breaks whenever the GitHub Windows runner ships a new Visual
      # Studio (e.g. VS 18 moved vcvarsall.bat to a path it doesn't probe). The native binary is
      # best-effort anyway — a failure here must NOT sink the whole Windows job and drop the reliable
      # app-image .zip (which is built earlier and is what actually ships).
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: ilammy/msvc-dev-cmd@v1

      # --- Best-effort artifact: native-image single binary (BM25 / Ollama; not onnx-local) ---
      # Linux and macOS: three passes. An instrumented build runs .github/scripts/pgo-workload.py (search, reads,
      # tree, history, writes, MCP) and writes a profile on SIGTERM; the shipped build is optimized with it.
      # Windows has no SIGTERM to make the instrumented binary write its profile, so it gets -O3 instead.
      - name: Build native-image
        id: native
        continue-on-error: true
        # Two native builds and a workload: a hang must end the step, not hold the release for the 6 h job limit.
        timeout-minutes: 75
        run: |
          BIN="build/native/nativeCompile/svod-engine${{ matrix.exe }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./gradlew -Psvod.jdk=23 "-Psvod.nativeArgs=-O3" nativeCompile --no-daemon
          else
            PROFILE="$RUNNER_TEMP/svod-engine.iprof"
            ./gradlew -Psvod.jdk=23 "-Psvod.nativeArgs=--pgo-instrument" nativeCompile --no-daemon
            cp "$BIN" "$RUNNER_TEMP/svod-engine-instrumented"
            python3 ../.github/scripts/pgo-workload.py "$RUNNER_TEMP/svod-engine-instrumented" "$PROFILE"
            ./gradlew -Psvod.jdk=23 "-Psvod.nativeArgs=--pgo=$PROFILE" nativeCompile --no-daemon
          fi
          test -f "$BIN" && cp "$BIN" "svod-engine-${{ matrix.label }}${{ matrix.exe }}"

      # A native build that compiles proves nothing: v1.30.0 shipped a Linux binary that crashed at
      # startup (Lucene FFM, missing reflection metadata) because nobody ever ran it. Start the built
      # binary on a real vault and use it; a binary that fails here is deleted so the upload step
      # below (which skips files that do not exist) can never publish it. The app-image is unaffected.
      - name: Smoke-test native-image
        id: smoke
        if: steps.native.outcome == 'success'
        continue-on-error: true
        run: |
          PY="$(command -v python3 || command -v python)"
          "$PY" ../.github/scripts/native-smoke.py "svod-engine-${{ matrix.label }}${{ matrix.exe }}"

      - name: Drop the native binary if it failed its smoke test
        if: steps.native.outcome == 'success' && steps.smoke.outcome != 'success'
        run: |
          echo "::warning::native-image smoke test failed; svod-engine-${{ matrix.label }}${{ matrix.exe }} is NOT uploaded (the app-image still ships)"
          rm -f "svod-engine-${{ matrix.label }}${{ matrix.exe }}"

      # Uploads one file at a time and retries: GitHub drops these 100-220 MB uploads often
      # enough ("Error saving asset", "other side closed") that one attempt is not a release.
      # The notes come from `prepare`, so no job regenerates them (three matrix jobs generating
      # notes is what printed the changelog three times in v1.17.0-v1.19.0).
      - name: Upload this platform's assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          # The native binary is named with this platform's extension and no other: on Windows,
          # `test -f svod-engine-windows-x64` is TRUE for the .exe (Git Bash resolves the
          # extension), so passing the bare name too made the job spend five attempts uploading
          # a path gh cannot match ("no matches found") and then fail.
          .github/scripts/publish-release-assets.sh "${{ github.ref_name }}" \
            engine/SvodEngine-${{ matrix.label }}.tar.gz \
            engine/SvodEngine-${{ matrix.label }}.zip \
            engine/svod-engine-${{ matrix.label }}${{ matrix.exe }}

  # The app-images are what actually ships; the native-image binaries are best-effort (their build
  # step is continue-on-error), so they are not required here.
  finalize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The native binaries are built with Oracle GraalVM (GFTC); say so where people download them.
      - name: Note the native binaries' licence in the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          body="$(gh release view "$TAG" --json body -q .body)"
          case "$body" in *"GraalVM Free Terms"*) exit 0 ;; esac
          note='The `svod-engine-*` native binaries are built with Oracle GraalVM and include parts licensed under the [GraalVM Free Terms and Conditions](https://www.oracle.com/downloads/licenses/graal-free-license.html): free to use, including in production; redistribution only free of charge. The source code and the `SvodEngine-*` app-images are Apache-2.0.'
          gh release edit "$TAG" --notes "$(printf '%s\n\n%s\n' "$body" "$note")"

      - name: Attach the self-update script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/publish-release-assets.sh "${{ github.ref_name }}" dist/self-update.sh
      # SHA256SUMS lets self-update.sh (and UpdateService) verify a download without ever calling
      # api.github.com, which is capped at 60 requests/hour per IP and used up in a shared-NAT
      # office. gh's own downloads are authenticated, so this step is not rate-limited.
      - name: Generate and publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          rm -rf sums && mkdir sums
          gh release download "${{ github.ref_name }}" -D sums --clobber
          # A re-run of this job re-downloads the SHA256SUMS the previous run published. Leaving it
          # in the directory makes `> SHA256SUMS` truncate it while the glob-expanded sha256sum is
          # still about to read it, publishing a junk self-referential line.
          rm -f sums/SHA256SUMS
          ( cd sums && sha256sum * > SHA256SUMS )
          cat sums/SHA256SUMS
          .github/scripts/publish-release-assets.sh "${{ github.ref_name }}" sums/SHA256SUMS
      - name: Publish the release once every required asset is on it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          .github/scripts/finalize-release.sh "${{ github.ref_name }}" \
            SvodEngine-macos-arm64.tar.gz \
            SvodEngine-linux-x64.tar.gz \
            SvodEngine-windows-x64.zip \
            self-update.sh \
            SHA256SUMS
