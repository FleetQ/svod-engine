name: release

# Cut a release by pushing a tag, e.g. `git tag v0.4.0 && git push origin v0.4.0`.
# A `-rc`/`-beta` tag publishes a prerelease. Each OS runner builds in place — native-image is
# host-only, so cross-platform binaries require this matrix (you cannot cross-compile them).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release + upload assets

jobs:
  # The release is created as a DRAFT here and published by `finalize` only after every required
  # asset is on it. Before, each build job published into the release itself: the first job to
  # finish flipped it out of draft, so v1.24.0 went public carrying only the two Linux assets
  # while the other two jobs were still failing their uploads.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — reusing it"
            exit 0
          fi
          args=(--draft --generate-notes --title "$TAG")
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" "${args[@]}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       label: macos-arm64,   exe: "" }
          - { os: ubuntu-latest,  label: linux-x64,     exe: "" }
          - { os: windows-latest, label: windows-x64,   exe: ".exe" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      # --- Toolchain 1: GraalVM/JDK 21 — builds the shipping jpackage app-image (incl. onnx-local). ---
      # Pinned to the proven GraalVM CE 21 so the app-image (the reliable v1.0.0 artifact) never regresses.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # --- Reliable artifact: self-contained app-image (full features, incl. onnx-local) ---
      - name: Build app-image (jpackage)
        run: |
          ./gradlew -Psvod.jdk=21 installDist --no-daemon
          MAIN_JAR=$(basename "$(ls build/install/svod-engine/lib/svod-engine-*.jar)")
          # jpackage --app-version accepts only numeric MAJOR[.MINOR[.PATCH]] — strip the tag's
          # leading `v` and any pre-release suffix (`v1.11.2-rc1` → `1.11.2`), else jpackage errors.
          APP_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="${APP_VERSION%%-*}"
          jpackage --type app-image --name SvodEngine \
            --input build/install/svod-engine/lib \
            --main-jar "$MAIN_JAR" --main-class dev.svod.engine.MainKt \
            --app-version "$APP_VERSION" --java-options "-Dfile.encoding=UTF-8" \
            --dest out

      - name: Archive app-image (unix)
        if: runner.os != 'Windows'
        run: |
          cd out
          if [ -d SvodEngine.app ]; then tar -czf "../SvodEngine-${{ matrix.label }}.tar.gz" SvodEngine.app
          else tar -czf "../SvodEngine-${{ matrix.label }}.tar.gz" SvodEngine; fi

      - name: Archive app-image (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/SvodEngine -DestinationPath SvodEngine-${{ matrix.label }}.zip

      # --- Toolchain 2: GraalVM/JDK 23 — builds the native-image single binary. ---
      # GraalVM CE for JDK 21 is permanently stuck at 21.0.2 (no community 21.0.3+), whose link stage
      # is a dead-end: macOS Xcode 15 ld rejects its objects, Linux libjava.a lacks
      # ScopedMemoryAccess.closeScope0, and FFM is incomplete. GraalVM CE for JDK 23 fixes all three
      # (complete FFM + modern linkers). This second setup-graalvm puts JDK 23 on PATH; the app-image
      # above already ran on JDK 21 and is unaffected. The native step builds with -Psvod.jdk=23.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "23"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Native-image links via the host C toolchain; on Windows that means MSVC. setup-graalvm does not
      # provision it, so without this the link stage fails with "Failed to find 'vcvarsall.bat'".
      # continue-on-error: this action breaks whenever the GitHub Windows runner ships a new Visual
      # Studio (e.g. VS 18 moved vcvarsall.bat to a path it doesn't probe). The native binary is
      # best-effort anyway — a failure here must NOT sink the whole Windows job and drop the reliable
      # app-image .zip (which is built earlier and is what actually ships).
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: ilammy/msvc-dev-cmd@v1

      # --- Best-effort artifact: native-image single binary (BM25 / Ollama; not onnx-local) ---
      - name: Build native-image
        id: native
        continue-on-error: true
        run: |
          ./gradlew -Psvod.jdk=23 nativeCompile --no-daemon
          BIN="build/native/nativeCompile/svod-engine${{ matrix.exe }}"
          test -f "$BIN" && cp "$BIN" "svod-engine-${{ matrix.label }}${{ matrix.exe }}"

      # Uploads one file at a time and retries: GitHub drops these 100-220 MB uploads often
      # enough ("Error saving asset", "other side closed") that one attempt is not a release.
      # The notes come from `prepare`, so no job regenerates them (three matrix jobs generating
      # notes is what printed the changelog three times in v1.17.0-v1.19.0).
      - name: Upload this platform's assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        working-directory: ${{ github.workspace }}
        run: |
          # The native binary is named with this platform's extension and no other: on Windows,
          # `test -f svod-engine-windows-x64` is TRUE for the .exe (Git Bash resolves the
          # extension), so passing the bare name too made the job spend five attempts uploading
          # a path gh cannot match ("no matches found") and then fail.
          .github/scripts/publish-release-assets.sh "${{ github.ref_name }}" \
            engine/SvodEngine-${{ matrix.label }}.tar.gz \
            engine/SvodEngine-${{ matrix.label }}.zip \
            engine/svod-engine-${{ matrix.label }}${{ matrix.exe }}

  # The app-images are what actually ships; the native-image binaries are best-effort (their build
  # step is continue-on-error), so they are not required here.
  finalize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach the self-update script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/publish-release-assets.sh "${{ github.ref_name }}" dist/self-update.sh
      - name: Publish the release once every required asset is on it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          .github/scripts/finalize-release.sh "${{ github.ref_name }}" \
            SvodEngine-macos-arm64.tar.gz \
            SvodEngine-linux-x64.tar.gz \
            SvodEngine-windows-x64.zip \
            self-update.sh
